name: approvals (post what you approve)

# Manual one-off check of your Telegram commands. The always-on listener (listen.yml) normally does this.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approvals
  cancel-in-progress: false

jobs:
  approvals:
    if: ${{ vars.BOT_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Handle approvals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TH_USER_ID: ${{ secrets.TH_USER_ID }}
          TH_TOKEN: ${{ secrets.TH_TOKEN }}
        run: python -m newsbot approvals

      - name: Upload run log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: approvals-log-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tell the owner on Telegram if this run failed
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          python -m newsbot notify "ERROR: workflow 'approvals' failed. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
