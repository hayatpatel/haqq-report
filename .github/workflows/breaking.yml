name: breaking

# Event-driven lane: priority (Palestine and crisis) feeds every 15 minutes.
# WARNING: 96 runs/day is about 2,900 minutes/month. That exceeds the 2,000 free minutes of a PRIVATE
# repo. On a private repo change the cron to "*/30" or "0 * * * *", or make the repo public
# (public repos have unlimited minutes, but then it must hold no secrets; it does not).
# Does nothing until the repository variable BOT_ENABLED is set to "true".
on:
  # Schedule switched off for now (the main run does 6 times a day). To bring it back, add:
  #   schedule:
  #     - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breaking
  cancel-in-progress: false

jobs:
  breaking:
    if: ${{ vars.BOT_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest priority feeds
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TH_USER_ID: ${{ secrets.TH_USER_ID }}
          TH_TOKEN: ${{ secrets.TH_TOKEN }}
        run: python -m newsbot run --priority

      - name: Upload run log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.workflow }}-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tell the owner on Telegram if this run failed
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          python -m newsbot notify "ERROR: workflow '${{ github.workflow }}' failed. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
