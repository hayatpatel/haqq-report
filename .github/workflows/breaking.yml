name: breaking

# Event-driven lane: priority (Palestine and crisis) feeds every 15 minutes.
# WARNING: 96 runs/day is about 2,900 minutes/month. That exceeds the 2,000 free minutes of a PRIVATE
# repo. On a private repo change the cron to "*/30" or "0 * * * *", or make the repo public
# (public repos have unlimited minutes, but then it must hold no secrets; it does not).
# Does nothing until the repository variable BOT_ENABLED is set to "true".
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breaking
  cancel-in-progress: false

jobs:
  breaking:
    if: ${{ vars.BOT_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest priority feeds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m newsbot ingest --priority
