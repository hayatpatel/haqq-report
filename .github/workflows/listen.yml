name: listen (Telegram commands and fast track)

# Stays connected to Telegram so your commands (/fbtoken, /tokenstatus, /pause, /status, /celeb) are answered within seconds,
# and runs the FAST TRACK every 5 minutes: critical news and celebrity events are checked, ranked and posted in near real time.
# GitHub often skips scheduled runs, so a new run is requested every 5 minutes (it waits in the queue; the listener also ends itself within 5 minutes of a new push to main and starts a fresh one with the new code).
# A waiting run starts the moment the running listener ends, so there is no gap and no listener is ever cancelled.
# The full pipeline (ingest.yml) runs separately every 4 hours.
# Does nothing until the repository variable BOT_ENABLED is set to "true".
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # lets the listener start the full run (ingest.yml) when GitHub skipped its schedule

concurrency:
  group: telegram-listener
  cancel-in-progress: false

jobs:
  listen:
    if: ${{ vars.BOT_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 235
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Listen for 3 hours 50 minutes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          TH_APP_SECRET: ${{ secrets.TH_APP_SECRET }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TH_USER_ID: ${{ secrets.TH_USER_ID }}
          TH_TOKEN: ${{ secrets.TH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m newsbot listen --minutes 230

      - name: Upload run log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: listen-log-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Tell the owner on Telegram if the listener failed
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          python -m newsbot notify "ERROR: the Telegram listener stopped. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
